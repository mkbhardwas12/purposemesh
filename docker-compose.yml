name: purposemesh-preview

services:
  api:
    image: purposemesh-api:local
    build:
      context: .
      target: api
    environment:
      CCA_MODE: demo
      CCA_JWT_SECRET: purposemesh-compose-demo-secret-only-do-not-reuse
      CCA_CORS_ORIGINS: http://127.0.0.1:${PURPOSEMESH_PORT:-5173},http://localhost:${PURPOSEMESH_PORT:-5173}
      CCA_CONTROL_DB: /app/data/cca-control.sqlite
      CCA_DB: /app/data/cca.sqlite
      CCA_FACT_ROWS: "100000"
      CCA_LOG_LEVEL: info
      CCA_TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: "8787"
    expose:
      - "8787"
    volumes:
      - purposemesh-data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 10s

  web:
    image: purposemesh-web:local
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PURPOSEMESH_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  purposemesh-data:
