      <rect width="190" height="112" rx="18" fill="#102327" stroke="#315057"/>
      <text x="24" y="34" fill="#58d8c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">VERIFIED SUBJECT</text>
      <text x="24" y="68" fill="#f1f6f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Identity + role</text>
      <text x="24" y="92" fill="#91a5a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">relationship facts</text>
    </g>
    <line x1="204" y1="56" x2="250" y2="56" stroke="#58d8c8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(264)">
      <rect width="230" height="112" rx="18" fill="#10302e" stroke="#2dd4bf" stroke-width="2"/>
      <text x="24" y="34" fill="#58d8c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">CONTRACT CAPSULE</text>
      <text x="24" y="68" fill="#f1f6f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Scope + context</text>
      <text x="24" y="92" fill="#a7cfca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">atomic and reviewable</text>
    </g>
    <line x1="508" y1="56" x2="554" y2="56" stroke="#58d8c8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(568)">
      <rect width="218" height="112" rx="18" fill="#102327" stroke="#315057"/>
      <text x="24" y="34" fill="#58d8c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">POLICY DECISION</text>
      <text x="24" y="68" fill="#f1f6f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Allow + obligations</text>
      <text x="24" y="92" fill="#91a5a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">or deny by default</text>
    </g>
  </g>

  <g transform="translate(915 182)">
    <rect width="295" height="330" rx="26" fill="#0b191d" stroke="#29434a" filter="url(#shadow)"/>
    <text x="28" y="43" fill="#f2a23a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" letter-spacing="1.8">TESTED LOCAL EVIDENCE</text>
    <text x="28" y="94" fill="#f4f8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="780">194 / 194</text>
    <text x="28" y="122" fill="#96aaad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">automated checks passed</text>
    <line x1="28" y1="150" x2="267" y2="150" stroke="#29434a"/>
    <text x="28" y="198" fill="#f4f8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760">100,000</text>
    <text x="28" y="225" fill="#96aaad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">synthetic records tested</text>
    <line x1="28" y1="253" x2="267" y2="253" stroke="#29434a"/>
    <circle cx="38" cy="290" r="10" fill="#143c35" stroke="#42c9a5"/>
    <path d="M33 290L37 294L44 286" fill="none" stroke="#5ee0bd" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="296" fill="#c9d6d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Local enforcement today</text>
  </g>

  <text x="70" y="596" fill="#6f8589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="0.8">RBAC + ABAC + ReBAC • DUAL APPROVAL • FIDELITY FIREWALL • EXPLAINABLE EVIDENCE</text>
