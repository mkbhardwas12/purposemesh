  <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280" stroke="#163336" stroke-width="1" opacity="0.45"/>
  <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640" stroke="#163336" stroke-width="1" opacity="0.45"/>

  <g transform="translate(70 58)">
    <rect width="54" height="54" rx="15" fill="#0c3433" stroke="#25ad9f"/>
    <path d="M27 12L39 17V27C39 35 34 41 27 44C20 41 15 35 15 27V17L27 12Z" fill="none" stroke="#2dd4bf" stroke-width="2.6"/>
    <path d="M21.5 27L25.5 31L33.5 22" fill="none" stroke="#2dd4bf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="25" fill="#f3f8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="750">CCA</text>
    <text x="72" y="48" fill="#8da1a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.4">CONTRACT CAPSULE AUTHORIZATION</text>
  </g>

  <g transform="translate(70 170)">
    <text fill="#f4f8f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="780">
      <tspan x="0" y="0">One authorization contract.</tspan>
      <tspan x="0" y="74">Exact data boundaries.</tspan>
    </text>
    <text x="2" y="125" fill="#a9bbbd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">
